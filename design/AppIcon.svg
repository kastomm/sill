<?xml version="1.0" encoding="UTF-8"?>
<!-- Sill's app icon (2026-10-17): a Mac's display and an iPad in front of it, the stream between them drawn as two
     arrows that loop around the pair (the Mac's picture to the device, the device's touches back).
     1024 grid, full square (iOS applies the squircle; macOS 26+ masks and lights it). Four groups
     for Icon Composer's layers: background, mac, ipad, arrows. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111114"/>
    <stop offset="1" stop-color="#000000"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.48" r="0.62">
    <stop offset="0" stop-color="#7a5cff" stop-opacity="0.32"/>
    <stop offset="0.55" stop-color="#ff5fa2" stop-opacity="0.06"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a3d4a"/>
    <stop offset="1" stop-color="#22242d"/>
  </linearGradient>
  <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b2e3a"/>
    <stop offset="1" stop-color="#15171f"/>
  </linearGradient>
  <linearGradient id="screenMac" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5b4bff"/>
    <stop offset="0.35" stop-color="#9b4dff"/>
    <stop offset="0.7" stop-color="#ff4f9a"/>
    <stop offset="1" stop-color="#ff8a3d"/>
  </linearGradient>
  <linearGradient id="screenPad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5b4bff"/>
    <stop offset="0.35" stop-color="#9b4dff"/>
    <stop offset="0.7" stop-color="#ff4f9a"/>
    <stop offset="1" stop-color="#ff8a3d"/>
  </linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="arrowA" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5b4bff" stop-opacity="0.1"/>
    <stop offset="0.5" stop-color="#9b4dff"/>
    <stop offset="1" stop-color="#ff4f9a"/>
  </linearGradient>
  <linearGradient id="arrowB" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.1"/>
    <stop offset="0.5" stop-color="#ff4f9a"/>
    <stop offset="1" stop-color="#9b4dff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
  </filter>
  <filter id="arrowGlow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="macScreen"><rect x="248" y="226" width="540" height="340" rx="22"/></clipPath>
  <clipPath id="padScreen"><rect x="386" y="470" width="368" height="276" rx="18"/></clipPath>
</defs>

<!-- background -->
<g id="background">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- faint grid of dots, the network -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="112" cy="112" r="5"/><circle cx="912" cy="112" r="5"/>
    <circle cx="112" cy="912" r="5"/><circle cx="912" cy="912" r="5"/>
    <circle cx="512" cy="88" r="4"/><circle cx="512" cy="936" r="4"/>
    <circle cx="88" cy="512" r="4"/><circle cx="936" cy="512" r="4"/>
  </g>
</g>

<!-- mac: a display, behind -->
<g id="mac" filter="url(#shadow)">
  <!-- stand -->
  <path d="M470 616 L554 616 L574 690 L450 690 Z" fill="url(#metalDark)"/>
  <rect x="404" y="686" width="216" height="22" rx="11" fill="url(#metal)"/>
  <!-- body -->
  <rect x="226" y="204" width="584" height="416" rx="40" fill="url(#metal)"/>
  <rect x="226" y="568" width="584" height="52" rx="0" fill="#1b1d25"/>
  <rect x="226" y="580" width="584" height="40" rx="40" fill="url(#metal)"/>
  <!-- screen -->
  <rect x="248" y="226" width="540" height="340" rx="22" fill="url(#screenMac)"/>
  <g clip-path="url(#macScreen)">
    <!-- a window on the Mac's screen: what Sill streams -->
    <rect x="300" y="286" width="300" height="196" rx="16" fill="#0d1230" fill-opacity="0.55"/>
    <rect x="300" y="286" width="300" height="34" rx="16" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="322" cy="303" r="7" fill="#ff5f57"/><circle cx="346" cy="303" r="7" fill="#febc2e"/><circle cx="370" cy="303" r="7" fill="#28c840"/>
    <rect x="322" y="340" width="190" height="14" rx="7" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="322" y="372" width="240" height="14" rx="7" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="322" y="404" width="150" height="14" rx="7" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="248" y="226" width="540" height="170" fill="url(#gloss)"/>
  </g>
</g>

<!-- ipad: in front, lower right, slightly turned -->
<g id="ipad" transform="translate(34 24) rotate(-6 570 608)" filter="url(#soft)">
  <rect x="364" y="448" width="412" height="320" rx="34" fill="url(#metalDark)"/>
  <rect x="364" y="448" width="412" height="320" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <rect x="386" y="470" width="368" height="276" rx="18" fill="url(#screenPad)"/>
  <g clip-path="url(#padScreen)">
    <!-- the same window, arrived on the device -->
    <rect x="418" y="506" width="232" height="152" rx="14" fill="#0d1230" fill-opacity="0.55"/>
    <rect x="418" y="506" width="232" height="28" rx="14" fill="#ffffff" fill-opacity="0.18"/>
    <circle cx="436" cy="520" r="6" fill="#ff5f57"/><circle cx="456" cy="520" r="6" fill="#febc2e"/><circle cx="476" cy="520" r="6" fill="#28c840"/>
    <rect x="436" y="550" width="146" height="12" rx="6" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="436" y="576" width="184" height="12" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="436" y="602" width="116" height="12" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="386" y="470" width="368" height="140" fill="url(#gloss)"/>
    <!-- a finger's touch ring -->
    <circle cx="690" cy="690" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="8"/>
    <circle cx="690" cy="690" r="9" fill="#ffffff"/>
  </g>
</g>

<!-- arrows: the stream to the device over the top, the touches back under the bottom -->
<g id="arrows" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)">
  <!-- top: Mac -> iPad, an arc sweeping right -->
  <path d="M330 160 C 500 100, 700 104, 846 212" stroke="url(#arrowA)" stroke-width="20"/>
  <path d="M827 159 L 846 212 L 790 210" stroke="#ff4f9a" stroke-width="20"/>
  <!-- bottom: iPad -> Mac, sweeping left -->
  <path d="M694 862 C 524 922, 324 918, 178 812" stroke="url(#arrowB)" stroke-width="20"/>
  <path d="M197 865 L 178 812 L 234 814" stroke="#9b4dff" stroke-width="20"/>
</g>
</svg>
